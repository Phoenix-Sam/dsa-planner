    // Simple robust JS CSV Parser function
    const parseCSV = (text) => {
      const lines = text.split(/\r?\n/);
      const patterns = [];
      let currentPattern = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const cols = [];
        let insideQuote = false;
        let currentCol = '';
        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            cols.push(currentCol.trim());
            currentCol = '';
          } else {
            currentCol += char;
          }
        }
        cols.push(currentCol.trim());

        // Check if pattern row
        const potentialHeader = cols.find(c => 
          /pattern:/i.test(c) || 
          /pattern\s*:/i.test(c) || 
          /^(\d+\.)?\s*pattern/i.test(c) ||
          /^[A-Z\s]+PATTERN/i.test(c)
        );

        if (potentialHeader) {
          let patName = potentialHeader.replace(/^\d+\.\s*/, '').replace(/Pattern\s*:\s*/i, '').trim();
          currentPattern = {
            name: patName || "General Pattern",
            questions: []
          };
          patterns.push(currentPattern);
        } else if (cols.length > 1) {
          const name = cols[1];
          const link1 = cols[2];
          const link2 = cols[3];
          const link3 = cols[4];
          
          if (name && (link1 || link2 || link3 || name.toLowerCase().includes('easy') || name.toLowerCase().includes('medium') || name.toLowerCase().includes('hard'))) {
            if (name.toLowerCase() === 'question' || name.toLowerCase().includes('insta channel')) continue;
            
            let difficulty = 'Medium';
            if (name.toLowerCase().includes('(easy)') || name.toLowerCase().includes('easy')) difficulty = 'Easy';
            else if (name.toLowerCase().includes('(hard)') || name.toLowerCase().includes('hard')) difficulty = 'Hard';
            else if (name.toLowerCase().includes('(medium)') || name.toLowerCase().includes('medium')) difficulty = 'Medium';

            const cleanName = name.replace(/\((easy|medium|hard)\)/i, '').trim();
            const validLinks = [link1, link2, link3].filter(l => l && l.startsWith('http'));

            if (currentPattern) {
              currentPattern.questions.push({
                name: cleanName,
                difficulty,
                links: validLinks
              });
            } else if (patterns.length > 0) {
              patterns[patterns.length - 1].questions.push({
                name: cleanName,
                difficulty,
                links: validLinks
              });
            }
          }
        }
      }
      return patterns.length > 0 ? patterns : null;
    };

      // Flatten questions list with patterns for unified queries
      const allQuestions = useMemo(() => {
        const list = [];
        patterns.forEach(pat => {
          pat.questions.forEach(q => {
            list.push({ ...q, patternName: pat.name });
          });
        });
        return list;
      }, [patterns]);

      // Calculate the 75-Day Schedule distribution dynamically
      const dayByDaySchedule = useMemo(() => {
        const plan = [];
        let questionIndex = 0;
        const totalQs = allQuestions.length;
        const targetDays = 75;

        // Evenly distribute questions across 75 days.
        const questionsPerDay = Math.ceil(totalQs / targetDays);

        for (let day = 1; day <= targetDays; day++) {
          const dayQuestions = [];
          
          // Every 7th day is a customized review/rest day
          if (day % 7 === 0) {
            plan.push({
              day,
              type: 'Review & Buffer',
              description: 'Review the past week’s algorithms, optimize slow solutions, and catch up on missed questions.',
              questions: []
            });
          } else {
            // Fill with questions
            for (let i = 0; i < questionsPerDay && questionIndex < totalQs; i++) {
              dayQuestions.push(allQuestions[questionIndex]);
              questionIndex++;
            }
            
            // Generate dynamic description based on predominant pattern of the day
            let desc = '';
            if (dayQuestions.length > 0) {
              const currentPattern = dayQuestions[0].patternName;
              desc = `Deep dive into standard ${currentPattern} logic. Focus on time and space complexity optimization.`;
            } else {
              desc = `Congratulations! You've scheduled all problems. Use this day for general review and mock mock interviews.`;
            }

            plan.push({
              day,
              type: 'Coding Day',
              description: desc,
              questions: dayQuestions
            });
          }
        }
        return plan;
      }, [allQuestions]);

      // Statistics calculations
      const stats = useMemo(() => {
        const total = allQuestions.length;
        const solved = Object.keys(completed).filter(k => completed[k]).length;
        const progressPercent = total > 0 ? Math.round((solved / total) * 100) : 0;
        
        const easyTotal = allQuestions.filter(q => q.difficulty === 'Easy').length;
        const easySolved = allQuestions.filter(q => q.difficulty === 'Easy' && completed[q.name]).length;
        
        const mediumTotal = allQuestions.filter(q => q.difficulty === 'Medium').length;
        const mediumSolved = allQuestions.filter(q => q.difficulty === 'Medium' && completed[q.name]).length;
        
        const hardTotal = allQuestions.filter(q => q.difficulty === 'Hard').length;
        const hardSolved = allQuestions.filter(q => q.difficulty === 'Hard' && completed[q.name]).length;

        return {
          total,
          solved,
          progressPercent,
          easy: { total: easyTotal, solved: easySolved, pct: easyTotal > 0 ? Math.round((easySolved/easyTotal)*100) : 0 },
          medium: { total: mediumTotal, solved: mediumSolved, pct: mediumTotal > 0 ? Math.round((mediumSolved/mediumTotal)*100) : 0 },
          hard: { total: hardTotal, solved: hardSolved, pct: hardTotal > 0 ? Math.round((hardSolved/hardTotal)*100) : 0 },

      }, [allQuestions, completed]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    // Trigger Lucide icons replacing after React render finishes
    setTimeout(() => {
      lucide.createIcons();
    }, 300);
  </script>
</body>
</html>
